<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Craftopia</title>
<link rel="alternate" hreflang="ja" href="https://tata-4g.github.io/app-pages/">
<link rel="alternate" hreflang="en" href="https://tata-4g.github.io/app-pages/en/">
<link rel="alternate" hreflang="x-default" href="https://tata-4g.github.io/app-pages/">
<script>
// ブラウザの言語が日本語以外なら英語版へ振り分ける。仕組みと理由は
// crispnote/index.html のコメントを参照。sessionStorageのキーはサイト全体で
// 共通なので、ここで日本語を選べばCrispNoteのページへ移っても日本語のまま。
(function () {
  var KEY = 'craftopia-lang';
  var wantsJa = location.search.indexOf('lang=ja') !== -1;
  try {
    if (wantsJa) sessionStorage.setItem(KEY, 'ja');
    else if (sessionStorage.getItem(KEY) === 'ja') wantsJa = true;
  } catch (e) {
    // プライベートモード等でsessionStorageが使えない場合はクエリだけで判断する。
  }
  if (wantsJa) return;
  var primary = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  if (primary.toLowerCase().indexOf('ja') === 0) return;
  location.replace('en/index.html' + location.hash);
})();
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px;
    line-height: 1.7;
    color: #222;
  }
  h1 { font-size: 1.4rem; }
  ul { padding-left: 1.2em; }
  li { margin-bottom: 0.9em; }
  .note { color: #555; font-size: 0.9rem; }
  a { color: #1a73e8; }
  footer { margin-top: 3em; font-size: 0.85rem; color: #666; }
  /* 見た目の意図は crispnote/index.html のコメントを参照。 */
  .lang-switch { display: flex; justify-content: flex-end; margin-bottom: 1.5em; }
  .lang-switch > * {
    font-size: 0.85rem;
    padding: 0.35em 0.9em;
    border: 1px solid #1e7d4f;
    line-height: 1.4;
    text-decoration: none;
  }
  .lang-switch > :first-child { border-radius: 6px 0 0 6px; }
  .lang-switch > :last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .lang-switch .current { background: #1e7d4f; color: #fff; font-weight: bold; }
  .lang-switch a { color: #1e7d4f; background: #fff; }
  .lang-switch a:hover { background: #eaf4ee; }
</style>
</head>
<body>
<nav class="lang-switch" aria-label="言語 / Language">

</nav>
